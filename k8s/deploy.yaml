apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: test
          image: crpi-5t4wtvylkfog8f2v.cn-hangzhou.personal.cr.aliyuncs.com/dtdev/test:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test
  namespace: apps
spec:
  selector:
    app: test
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test
  namespace: apps
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test
                port:
                  number: 80
